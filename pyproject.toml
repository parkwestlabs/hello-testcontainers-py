[project]
name = "hello-testcontainers-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "parkwestlabs", email = "281970052+parkwestlabs@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
hello-testcontainers-py = "hello_testcontainers_py:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
]

[tool.fastapi]
entrypoint = "hello_testcontainers_py.main:app"
